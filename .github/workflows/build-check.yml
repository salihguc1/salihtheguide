name: build-check
on:
  push:
    branches: [build-check-blog-posts]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Publish build output to a temporary branch
        run: |
          sudo chown -R "$(id -u)" _site
          cd _site
          git init -q
          git config user.name build-check
          git config user.email build-check@users.noreply.github.com
          git add -A
          git commit -q -m "Build output"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:build-check-output
